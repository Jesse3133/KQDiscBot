[project]
name = "kqbot"
version = "0.1.0"
description = "Fiesta KQ Bot: Discord reminders for Fiesta Online Kingdom Quests"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
